<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>SRR2 — Fungus BD Follow-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --blue:#1877f2;--blue-dk:#166fe5;--blue-lt:#e7f3ff;
  --bg:#f0f2f5;--surface:#fff;--border:#dde1e7;--text:#050505;--muted:#65676b;--hover:#f2f3f5;
  --green:#42b72a;--green-dk:#1a5c0c;--green-lt:#e6f4ea;
  --red:#fa3e3e;--red-dk:#9b1c1c;--red-lt:#fdeaea;
  --amber:#f7b928;--amber-dk:#856404;--amber-lt:#fff3cd;
  --purple:#7c3aed;--purple-lt:#f3e8ff;
  --font:'Inter','Noto Sans Myanmar',sans-serif;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;padding-bottom:40px}
.my{font-family:'Noto Sans Myanmar',var(--font);font-weight:400;color:var(--muted);font-size:.85em}
button{font-family:var(--font)}
.nav{background:var(--blue);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:300;box-shadow:0 2px 8px rgba(24,119,242,.3);gap:10px}
.nav-logo{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.nav-ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nav-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.nav-sub{font-size:10.5px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);cursor:pointer;white-space:nowrap}
.pill.ok{background:#e6f4ea;color:var(--green-dk);border-color:var(--green)}
.pill.warn{background:var(--amber-lt);color:var(--amber-dk);border-color:var(--amber)}
.pill.err{background:var(--red-lt);color:var(--red-dk);border-color:var(--red)}
.clock{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 12px;overflow-x:auto;position:sticky;top:56px;z-index:250}
.tab{padding:10px 14px;border:none;background:transparent;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;line-height:1.25;text-align:center;position:relative}
.tab .my{display:block;font-size:10px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab .badge{position:absolute;top:4px;right:2px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;border-radius:9px;padding:1px 5px}
.main{max-width:1180px;margin:0 auto;padding:14px 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fafbfc}
.card-t{font-size:14px;font-weight:800}
.card-b{padding:12px 14px}
.sp{flex:1}
.lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px;display:block}
.lbl .my{text-transform:none;letter-spacing:0;font-size:10.5px}
.in{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:var(--font);color:var(--text);background:var(--bg);outline:none}
.in:focus{border-color:var(--blue);background:#fff}
textarea.in{resize:vertical;min-height:56px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);line-height:1.2;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:#fff;border-color:var(--red);color:var(--red-dk)}
.btn.redf{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .my{color:inherit;opacity:.85}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:54px;padding:7px 6px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);line-height:1.15}
.seg button .my{display:block;font-size:9.5px;color:inherit}
.seg button.on{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.seg button.on.g{background:var(--green-lt);border-color:var(--green);color:var(--green-dk)}
.seg button.on.r{background:var(--red-lt);border-color:var(--red);color:var(--red-dk)}
.seg button.on.a{background:var(--amber-lt);border-color:var(--amber);color:var(--amber-dk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--hover);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.b{background:var(--blue-lt);color:var(--blue);border-color:#9cc4f7}
.chip.g{background:var(--green-lt);color:var(--green-dk);border-color:#9fd89a}
.chip.r{background:var(--red-lt);color:var(--red-dk);border-color:#f3a5a5}
.chip.a{background:var(--amber-lt);color:var(--amber-dk);border-color:#f2d27d}
.prefill{background:var(--amber-lt);border:1px solid #f2d27d;color:var(--amber-dk);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
.note{font-size:11.5px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.25;display:block}
.stat small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.bigc{border-radius:14px;padding:14px 16px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bigc b{display:block;font-size:38px;font-weight:800;line-height:1.05}
.bigc span{font-size:12px;font-weight:700;opacity:.95;display:block;line-height:1.3}
.bigc small{font-size:11px;opacity:.9}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.topbar .f-emp{flex:1;min-width:170px}
.datebox{display:flex;gap:4px;align-items:center}
.datebox .in{width:150px}
.datebox .btn{padding:8px 10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.chart-box{position:relative;height:260px}
.pbar{display:grid;grid-template-columns:118px 1fr 74px;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.pbar .bar{height:14px;background:#e4e6eb;border-radius:7px;overflow:hidden}
.pbar .bar i{display:block;height:100%;background:var(--red);border-radius:7px}
.pbar b{text-align:right}

/* DAILY CHECK */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.area{background:#fff;border:2px solid var(--border);border-radius:12px;overflow:hidden}
.area.none{border-color:#9fd89a;background:#f7fdf6}
.area.found{border-color:#f3a5a5}
.area.open{grid-column:1/-1;border-color:var(--red)}
.area.open .parts{grid-template-columns:repeat(6,1fr)}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:8px}
.area-h{padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.area-h .nm{font-weight:800;font-size:15px;line-height:1.2}
.area-b{padding:0 12px 12px}
.yn{display:flex;gap:6px}
.yn button{flex:1;padding:10px 6px;border-radius:9px;border:2px solid var(--border);background:#fff;font-weight:800;font-size:13px;cursor:pointer;line-height:1.15}
.yn button .my{display:block;font-size:10px;font-weight:400;color:inherit}
.yn button.on.no{background:var(--green);border-color:var(--green);color:#fff}
.yn button.on.yes{background:var(--red);border-color:var(--red);color:#fff}
.animal{border:1.5px solid #f3c2c2;background:#fffafa;border-radius:10px;padding:10px;margin-top:8px}
.animal-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:800}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.part{display:flex;align-items:center;gap:5px;padding:6px 6px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;line-height:1.1;user-select:none}
.part input{width:16px;height:16px;flex-shrink:0;accent-color:var(--red)}
.part .my{display:block;font-size:9.5px}
.part.on{border-color:var(--red);background:var(--red-lt);color:var(--red-dk)}
.gp-display{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;line-height:1.3;text-align:left}
.gp-display.empty{color:var(--muted);font-weight:500}
.savebar{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;align-items:center}

/* HOLDING */
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.hcard{background:#fff;border:2px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.hcard.better{border-color:#9fd89a}
.hcard.worse{border-color:#f3a5a5}
.hcard.done{opacity:.6}
.hcard-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hcard-h b{font-size:15px}
.fu{display:flex;gap:3px;flex-wrap:wrap}
.fu i{font-style:normal;font-size:10px;font-weight:800;border-radius:4px;padding:1px 4px;color:#fff}

/* TABLES / MODALS */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.t th{background:#f5f6f8;font-size:10.5px;font-weight:800;color:var(--muted);padding:7px 9px;text-align:center;border-bottom:2px solid var(--border);white-space:nowrap;line-height:1.2}
table.t th .my{display:block;font-weight:400;font-size:9.5px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:6px 9px;border-bottom:1px solid #eef0f3;text-align:center;white-space:nowrap}
table.t tr.tot td{background:#f5f6f8;font-weight:800;border-top:2px solid var(--border)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:14px 8px;overflow-y:auto}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:12px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sheet-t{font-size:16px;font-weight:800;flex:1;line-height:1.2}
.sheet-b{padding:12px 14px;overflow-y:auto}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:50%;border:none;background:#f0f2f5;font-size:15px;cursor:pointer;flex-shrink:0}
#gp-modal{z-index:700}
.gp-group{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 6px}
.gp-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.gp-item{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 0;cursor:pointer}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:900;pointer-events:none;background:#333;color:#fff;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
@media(max-width:640px){
  .g3,.g4{grid-template-columns:1fr 1fr}
  .g2.stack{grid-template-columns:1fr}
  .parts,.area.open .parts{grid-template-columns:repeat(3,1fr)}
  .animals{grid-template-columns:1fr}
  .nav-name{font-size:13.5px}
  .clock{display:none}
  .areas,.hold{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .pbar{grid-template-columns:96px 1fr 64px}
  .bigc b{font-size:30px}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">
    <div class="nav-ico">🍄</div>
    <div style="min-width:0">
      <div class="nav-name">Fungus BD · SRR2</div>
      <div class="nav-sub">ဘီဒီ မှို နောက်ဆက်တွဲ စောင့်ကြည့်ခြင်း — SRR2</div>
    </div>
  </div>
  <div class="nav-right">
    <span class="pill" id="pill" onclick="syncNow()">⬤ …</span>
    <span class="clock" id="clock"></span>
  </div>
</nav>
<div class="tabs">
  <button class="tab on" id="tab-dash" onclick="showTab('dash')">📊 Dashboard<span class="my">အနှစ်ချုပ်</span></button>
  <button class="tab" id="tab-check" onclick="showTab('check')">✅ Daily Check<span class="my">နေ့စဉ် စစ်ဆေးမှု</span><span class="badge" id="check-badge" style="display:none"></span></button>
  <button class="tab" id="tab-hold" onclick="showTab('hold')">🏥 Holding Area<span class="my">မှို ခွဲထားရာနေရာ</span><span class="badge" id="hold-badge" style="display:none;background:#7c3aed"></span></button>
  <button class="tab" id="tab-hist" onclick="showTab('hist')">🕐 History<span class="my">မှတ်တမ်း</span></button>
  <button class="tab" id="tab-setup" onclick="showTab('setup')">⚙️ Setup<span class="my">ပြင်ဆင်ရန်</span></button>
</div>
<div class="main">
  <div id="setup-warn" class="prefill" style="display:none"></div>
  <div id="page-dash"></div>
  <div id="page-check" style="display:none"></div>
  <div id="page-hold" style="display:none"></div>
  <div id="page-hist" style="display:none"></div>
  <div id="page-setup" style="display:none"></div>
</div>

<!-- ANIMAL EDITOR -->
<div class="ov" id="case-ov" onclick="if(event.target===this) closeCase()">
  <div class="sheet">
    <div class="sheet-h"><div class="sheet-t" id="case-title"></div><button class="x" onclick="closeCase()">✕</button></div>
    <div class="sheet-b" id="case-body"></div>
    <div class="sheet-f">
      <button class="btn red" onclick="deleteCase()">🗑 Delete · <span class="my">ဖျက်ရန်</span></button>
      <span style="flex:1"></span>
      <button class="btn" onclick="closeCase()">Cancel · <span class="my">မလုပ်တော့</span></button>
      <button class="btn grn" onclick="saveCaseEdit()">💾 Save · <span class="my">သိမ်းရန်</span></button>
    </div>
  </div>
</div>

<!-- GENE / MORPH PICKER (same list as the Animal ID app) -->
<div class="ov" id="gp-modal" onclick="if(event.target===this) closeGenePicker()">
  <div class="sheet" style="max-width:480px">
    <div class="sheet-h"><div class="sheet-t">🧬 Select Genes<div class="my" style="font-size:12px">မျိုးရိုးလက္ခဏာများ ရွေးပါ</div></div><button class="x" onclick="closeGenePicker()">✕</button></div>
    <div class="sheet-b" id="gp-body"></div>
    <div class="sheet-f">
      <button class="btn" onclick="clearGenePicker()">Clear · <span class="my">ဖျက်ရန်</span></button>
      <button class="btn" onclick="closeGenePicker()">Cancel · <span class="my">မလုပ်တော့</span></button>
      <button class="btn pri" onclick="confirmGenePicker()">✔ Apply · <span class="my">အတည်ပြု</span></button>
    </div>
  </div>
</div>
<datalist id="loc-list"></datalist>
<div class="toast" id="toast"></div>
<script>
// ══════════════════════════════════════════════════════════════════
// CONFIG + GLOBAL STATE — every global lives up here (declared before init)
// ══════════════════════════════════════════════════════════════════
// Paste the Apps Script /exec URL here (see Code.gs → SETUP):
var SHEET_URL = '';
var NEED_SCRIPT_VERSION = '2026-11-05a';
var APP_VERSION = '2026-11-05a';
var LS_KEY = 'srr_fungus_v1';
var KEEP_DAYS = 45;              // this device keeps 45 days (+ every animal still in holding)

// Body parts — check boxes
var PARTS = [
  {k:'HEAD',  en:'Head',         my:'ခေါင်း'},
  {k:'LEYE',  en:'Left eye',     my:'ဘယ်မျက်လုံး'},
  {k:'REYE',  en:'Right eye',    my:'ညာမျက်လုံး'},
  {k:'BEYE',  en:'Both eyes',    my:'မျက်လုံး နှစ်ဖက်'},
  {k:'NAIL',  en:'Fingernails',  my:'လက်သည်း'},
  {k:'ARM',   en:'Arms',         my:'လက် (ရှေ့ခြေ)'},
  {k:'LEG',   en:'Legs',         my:'ခြေ (နောက်ခြေ)'},
  {k:'BELLY', en:'Belly',        my:'ဗိုက်'},
  {k:'BUTT',  en:'Butt',         my:'တင်ပါး'},
  {k:'BACK',  en:'Back',         my:'ကျော'},
  {k:'MOUTH', en:'Mouth',        my:'ပါးစပ်'},
  {k:'NOSE',  en:'Nose',         my:'နှာခေါင်း'}
];
var GROUPS = ['G1','G2','G3','G4','G5','G6','Unknown'];
var GROUP_COLORS = {G1:'#1877f2',G2:'#0e9f6e',G3:'#7c3aed',G4:'#e8590c',G5:'#d6336c',G6:'#0891b2',Unknown:'#6b7280','':'#9ca3af'};
var FU = { better:{en:'Better',my:'သက်သာ',c:'#1a7f37',ic:'👍'}, same:{en:'Same',my:'အတူတူ',c:'#6b7280',ic:'➖'}, worse:{en:'Worse',my:'ဆိုးလာ',c:'#c00',ic:'👎'} };

// ── LOCATIONS: the same tubs / cages as the Animal ID app ──
var INFR_ENCLOSURE_COUNTS = { 'INFR#1': 28, 'INFR#2': 22, 'INFR#3': 31, 'INFR#4': 45 };
var LEFT_ROWS = ['23A']; for(var _n=22;_n>=6;_n--){ LEFT_ROWS.push(_n+'B'); LEFT_ROWS.push(_n+'A'); }
var RIGHT_ROWS = ['46A']; for(var _n2=45;_n2>=29;_n2--){ RIGHT_ROWS.push(_n2+'B'); RIGHT_ROWS.push(_n2+'A'); }
var TUBS_PER_ROW = 26;
function tubsOf(rows){ var a=[]; rows.forEach(function(r){ for(var t=1;t<=TUBS_PER_ROW;t++) a.push(r+'-'+t); }); return a; }
function infrOf(site){ var a=[]; for(var i=1;i<=INFR_ENCLOSURE_COUNTS[site];i++) a.push(site+'-'+i); return a; }
function frOf(){ var a=[]; for(var n=1;n<=25;n++) ['A','B','C','D','E','F'].forEach(function(L){ a.push('FR#'+n+L); }); return a; }

function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(a, b){ var p=a.split('-'), q=b.split('-'); return Math.round((Date.UTC(+q[0],+q[1]-1,+q[2]) - Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function niceDate(s){
  if(!s) return '—';
  var d=dayDiff(todayStr(), s);
  if(d===0) return 'Today'; if(d===-1) return 'Yesterday';
  return parseYmd(s).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}
function localStorage_get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function emp(){ var e=document.getElementById('emp'); return e ? (e.value||'').trim() : (localStorage_get('srr_fungus_emp')||''); }
function saveEmp(v){ try{ localStorage.setItem('srr_fungus_emp', v); }catch(e){} }
function showToast(m, cls){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show '+(cls||''); clearTimeout(t._h); t._h=setTimeout(function(){ t.className='toast'; }, 2800); }
function settings(){ var s=DB.settings.main; return s && !s.deleted ? s : {id:'main', areas:[], emps:[], hold:'Fungus Holding Area'}; }
function holdName(){ return settings().hold || 'Fungus Holding Area'; }
function areas(){
  var hidden=settings().hidden||[];
  return BASE_AREAS.filter(function(a){ return hidden.indexOf(a.id)<0; }).concat((settings().areas||[]).map(function(a,i){ return {id:a.id, name:a.name, my:a.my||'', c:EXTRA_COLORS[i%EXTRA_COLORS.length], locs:(a.locs||[])}; }));
}
function area(id){ var all=areas().concat(BASE_AREAS); for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i]; return {id:id, name:id||'—', my:'', c:'#9ca3af', locs:[]}; }
function areaOfLoc(loc){
  var L=String(loc||'').trim().toUpperCase(); if(!L) return '';
  var m=/^INFR#(\d)/.exec(L); if(m) return 'INFR'+m[1];
  if(/^FR#/.test(L)) return 'FR';
  m=/^(\d+)[AB]/.exec(L); if(m){ var n=+m[1]; return n<=23 ? 'WTL' : 'WTR'; }
  return '';
}
function part(k){ for(var i=0;i<PARTS.length;i++) if(PARTS[i].k===k) return PARTS[i]; return {k:k,en:k,my:''}; }
function sexIc(s){ return s==='M'?'♂':s==='F'?'♀':'?'; }
function allCases(){
  var m={}; Object.keys(DB.case).forEach(function(k){ m[k]=DB.case[k]; });
  if(EXTRA) EXTRA.case.forEach(function(o){ if(!m[o.id] || num(o.updatedAt)>num(m[o.id].updatedAt)) m[o.id]=o; });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(c){ return !c.deleted; });
}
function allChecks(){
  var m={}; Object.keys(DB.check).forEach(function(k){ m[k]=DB.check[k]; });
  if(EXTRA) EXTRA.check.forEach(function(o){ if(!m[o.id] || num(o.updatedAt)>num(m[o.id].updatedAt)) m[o.id]=o; });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(c){ return !c.deleted; });
}
function lastFu(c){ var f=(c.fu||[]).slice().sort(function(a,b){ return a.d<b.d?-1:1; }); return f[f.length-1]||null; }
function fuOn(c, d){ return (c.fu||[]).filter(function(f){ return f.d===d; })[0]||null; }
function daysIn(c){ return dayDiff(c.date, c.st==='hold' ? todayStr() : (c.outD||todayStr())); }

function loadLocal(){
  try{ var d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(d && d.DB){ DB=d.DB; PENDING=d.PENDING||{}; SERVER_TS=d.SERVER_TS||0; DRAFT=d.DRAFT||{}; } }catch(e){}
  KINDS.forEach(function(k){ if(!DB[k]) DB[k]={}; });
}
function persist(){
  var cut=addDays(todayStr(), -KEEP_DAYS);
  Object.keys(DB.check).forEach(function(k){ if(DB.check[k].date<cut && !PENDING['check|'+k]) delete DB.check[k]; });
  Object.keys(DB.case).forEach(function(k){ var c=DB.case[k]; if(c.date<cut && c.st!=='hold' && (c.outD||'')<cut && !PENDING['case|'+k]) delete DB.case[k]; });
  try{ localStorage.setItem(LS_KEY, JSON.stringify({DB:DB, PENDING:PENDING, SERVER_TS:SERVER_TS, DRAFT:DRAFT})); storeFull=false; }
  catch(e){
    storeFull=true;
    try{ var o={check:{},case:{},settings:DB.settings}; Object.keys(PENDING).forEach(function(pk){ var i=pk.indexOf('|'), k=pk.slice(0,i), id=pk.slice(i+1); if(DB[k]&&DB[k][id]) o[k][id]=DB[k][id]; });
      localStorage.setItem(LS_KEY, JSON.stringify({DB:o, PENDING:PENDING, SERVER_TS:0, DRAFT:DRAFT})); }catch(e2){}
  }
}
function saveRecord(kind, o){
  o.updatedAt=Date.now(); if(!o.by) o.by=emp();
  DB[kind][o.id]=o; PENDING[kind+'|'+o.id]=true;
  if(EXTRA){ EXTRA[kind]=EXTRA[kind]||[]; EXTRA[kind]=EXTRA[kind].filter(function(x){ return x.id!==o.id; }); }
  persist(); pushPending();
}

// SYNC — never gets stuck on one bad record; shows the real reason
// ══════════════════════════════════════════════════════════════════
function setPill(txt,cls){ var p=document.getElementById('pill'); p.textContent='⬤ '+txt; p.className='pill '+(cls||''); }
function pillState(){
  var n=Object.keys(PENDING).length;
  if(!SHEET_URL) setPill('Not connected · '+n+' on device','warn');
  else if(scriptOutdated) setPill('Sheet script old','err');
  else if(LAST_ERR) setPill('Not saving · '+n+' waiting','err');
  else if(n) setPill(n+' not sent · မပို့ရသေး','warn');
  else setPill('Live ✓ '+nowHM(),'ok');
}
function apiErr(kind, msg){ var e=new Error(msg); e.kind=kind; return e; }
function api(body){
  var q=JSON.stringify(body);
  var url=SHEET_URL+'?payload='+encodeURIComponent(q)+'&t='+Date.now();
  var p = url.length<7000 ? fetch(url,{method:'GET'}) : fetch(SHEET_URL,{method:'POST',body:q});
  return p.catch(function(){ throw apiErr('net', navigator.onLine===false ? 'No internet on this device' : 'Could not reach the Google Sheet script'); })
  .then(function(r){ return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){
      var low=String(t||'').toLowerCase();
      if(/sign in|accounts\.google|servicelogin/.test(low)) throw apiErr('html','Google asked for a sign-in — the deployment must be "Who has access: Anyone"');
      throw apiErr('html','The Sheet script replied with an error page, not data');
    }
    if(!j.version || String(j.version)<NEED_SCRIPT_VERSION){ scriptOutdated=true; throw apiErr('old','Sheet script is out of date'); }
    scriptOutdated=false;
    if(!j.ok) throw apiErr('server', j.error||'Sheet error');
    if(LAST_ERR && LAST_ERR.kind!=='server'){ LAST_ERR=null; hideProblem(); }
    return j;
  });
}
function pushPending(){
  if(!SHEET_URL||pushing){ pillState(); return; }
  var now=Date.now(), keys=Object.keys(PENDING).filter(function(k){ return !FAILED[k] || now-FAILED[k].at>300000; });
  if(!keys.length){ pillState(); return; }
  pushing=true; setPill('Saving… · သိမ်းနေ','warn');
  var pk=keys[0], i=pk.indexOf('|'), kind=pk.slice(0,i), id=pk.slice(i+1), obj=DB[kind][id];
  if(!obj){ delete PENDING[pk]; pushing=false; persist(); return pushPending(); }
  var sentAt=obj.updatedAt;
  api({action:'save', kind:kind, obj:obj}).then(function(){
    if(DB[kind][id] && DB[kind][id].updatedAt===sentAt) delete PENDING[pk];
    delete FAILED[pk];
    if(LAST_ERR && LAST_ERR.kind==='server' && !Object.keys(FAILED).length){ LAST_ERR=null; hideProblem(); }
    persist(); pushing=false; pushPending();
  }).catch(function(err){
    pushing=false;
    if(err.kind==='server'){ FAILED[pk]={msg:err.message, at:Date.now()}; LAST_ERR={kind:'server', msg:err.message, at:Date.now()}; showProblem(); return pushPending(); }
    LAST_ERR={kind:err.kind||'net', msg:err.message, at:Date.now()}; showProblem(); pillState();
  });
}
var FIX_TXT = {
  net:'Check the Wi-Fi / mobile data. If the internet works, open the test link — it should show text starting with {"ok".',
  html:'Apps Script → Deploy → Manage deployments → ✎ Edit → Who has access: <b>Anyone</b> → Version: <b>New version</b> → Deploy. Do NOT make a "New deployment".',
  old:'Paste the latest Code.gs, Save, then Deploy → Manage deployments → ✎ Edit → New version → Deploy.',
  server:'The Sheet refused one record — the rest keep saving. Send Claude a screenshot of this bar.'
};
function showProblem(){
  if(!LAST_ERR) return;
  var n=Object.keys(PENDING).length, el=document.getElementById('setup-warn');
  el.className='prefill problem';
  el.innerHTML='<b>⚠️ Not saving to the Google Sheet · Google Sheet သို့ မသိမ်းနိုင်ပါ</b><br>'+esc(LAST_ERR.msg)+' · '+n+' waiting on this device (kept safe) · <span class="my">ဤဖုန်းတွင် သိမ်းထားသည်</span>'+
    '<div style="margin:6px 0;font-weight:500">'+FIX_TXT[LAST_ERR.kind||'net']+'</div><div class="chips"><button class="btn sm pri" onclick="syncNow()">🔄 Try again · ထပ်ကြိုးစား</button>'+
    '<a class="btn sm" target="_blank" rel="noopener" href="'+esc(SHEET_URL)+'?payload=%7B%22action%22%3A%22ping%22%7D">🔗 Open test link</a></div>';
  el.style.display='block';
}
function hideProblem(){ var el=document.getElementById('setup-warn'); if(el.classList.contains('problem')){ el.style.display='none'; el.classList.remove('problem'); } }
function mergeList(res){
  var changed=0;
  KINDS.forEach(function(kind){
    (res[kind]||[]).forEach(function(o){
      if(!o || !o.id || PENDING[kind+'|'+o.id]) return;
      var l=DB[kind][o.id];
      if(!l || num(o.updatedAt)>num(l.updatedAt)){ DB[kind][o.id]=o; changed++; }
    });
  });
  if(res.now) SERVER_TS=res.now; if(res.lastMod) LAST_MOD=res.lastMod;
  return changed;
}
function pull(){
  if(!SHEET_URL){ pillState(); return Promise.resolve(); }
  var first=!SERVER_TS;
  var p = first ? api({action:'list', days:KEEP_DAYS}) : api({action:'ping'}).then(function(j){ if(j.lastMod===LAST_MOD) return null; return api({action:'list', since:SERVER_TS-60000}); });
  return p.then(function(res){
    if(!res){ pillState(); return; }
    var ch=mergeList(res); persist();
    if(ch){ refreshAfterPull(); if(!first) showToast('🔄 '+ch+' update'+(ch>1?'s':'')+' from other devices · ဒေတာအသစ်'); }
    pillState(); pushPending();
  }).catch(function(e){ LAST_ERR={kind:e.kind||'net', msg:e.message, at:Date.now()}; showProblem(); pillState(); });
}
function refreshAfterPull(){
  if(EDIT){ updBadges(); return; }
  if(curTab==='check' && document.querySelector('#page-check input:focus, #page-check textarea:focus')){ updBadges(); return; }
  refresh();
}
function syncNow(){ if(!SHEET_URL){ showSetupWarn(); return; } pull(); pushPending(); }
function showSetupWarn(){
  var el=document.getElementById('setup-warn');
  el.innerHTML='⚠️ Not connected to Google Sheets yet — everything is kept on this device only. Paste the Apps Script /exec link into <b>SHEET_URL</b> in index.html. · Google Sheet မချိတ်ရသေးပါ';
  el.style.display='block';
}

function setRange(k){
  dashRange=k;
  if(+k>KEEP_DAYS && SHEET_URL && (!EXTRA || EXTRA.from>addDays(todayStr(),-(+k-1)))){
    renderDash(true);
    api({action:'list', from:addDays(todayStr(),-(+k-1)), to:todayStr()}).then(function(res){
      EXTRA={from:addDays(todayStr(),-(+k-1)), case:res.case||[], check:res.check||[]}; renderDash();
    }).catch(function(e){ showToast('⚠️ Could not load the year from the Sheet — showing what this device has','err'); renderDash(); });
    return;
  }
  renderDash();
}
function computeStats(from, to){
  var C=allCases(), K=allChecks();
  var found=C.filter(function(c){ return c.date>=from && c.date<=to; });
  var S={found:found, n:found.length, M:0, F:0, U:0, w:[], parts:{}, area:{}, grp:{}, loc:{}, morph:{}};
  found.forEach(function(c){
    if(c.sex==='M') S.M++; else if(c.sex==='F') S.F++; else S.U++;
    if(num(c.w)>0) S.w.push(num(c.w));
    (c.parts||[]).forEach(function(p){ S.parts[p]=(S.parts[p]||0)+1; });
    S.area[c.area]=(S.area[c.area]||0)+1;
    var g=c.grp||'Unknown'; S.grp[g]=(S.grp[g]||0)+1;
    if(c.loc) S.loc[c.loc]=(S.loc[c.loc]||0)+1;
    String(c.morph||'UC').split('/').map(function(x){ return x.trim(); }).filter(String).forEach(function(m){ S.morph[m]=(S.morph[m]||0)+1; });
  });

function saveArea(id){

  h+='<div class="card">'+(rows.length ? '<div class="tbl-wrap"><table class="t"><thead><tr><th>Found<span class="my">ရက်</span></th><th>Area<span class="my">နေရာ</span></th><th>Tub/cage</th><th>ID</th><th>Sex</th><th>Weight</th><th>Group</th><th style="text-align:left">Morph</th><th style="text-align:left">Fungus on<span class="my">မှိုနေရာ</span></th><th>Status<span class="my">အခြေအနေ</span></th><th>Days</th><th>By</th></tr></thead><tbody>'+
    rows.map(function(c){
      var st = c.st==='hold' ? '<span class="chip b">🏥 holding</span>' : c.st==='rec' ? '<span class="chip g">✅ '+niceDate(c.outD)+'</span>' : '<span class="chip">💀 '+niceDate(c.outD)+'</span>';
      return '<tr style="cursor:pointer" onclick="openCase(\''+c.id+'\')"><td>'+niceDate(c.date)+'</td><td>'+esc(area(c.area).name)+'</td><td><b>'+esc(c.loc||'—')+'</b></td><td>'+esc(c.aid||'')+'</td><td>'+sexIc(c.sex)+'</td><td>'+(c.w?esc(c.w)+' g':'—')+'</td><td>'+esc(c.grp||'—')+'</td>'+
        '<td style="text-align:left">'+esc(c.morph||'')+'</td><td style="text-align:left;white-space:normal">'+(c.parts||[]).map(function(p){ return part(p).en; }).join(', ')+'</td><td>'+st+'</td><td>'+(daysIn(c)+1)+'</td><td>'+esc(c.emp||'')+'</td></tr>';
    }).join('')+'</tbody></table></div>' : '<div class="empty">Nothing for these filters. This device keeps '+KEEP_DAYS+' days — press "Load from Sheet" for older dates. · မရှိပါ</div>')+'</div>';
  el.innerHTML=h;
}
function loadOld(){
  showToast('Loading… · ဆွဲယူနေ');
  api({action:'list', from:histF.from, to:histF.to}).then(function(res){
    var old=EXTRA||{from:histF.from, case:[], check:[]};
    var m={}; old.case.concat(res.case||[]).forEach(function(o){ m[o.id]=o; }); old.case=Object.keys(m).map(function(k){ return m[k]; });
    var k={}; old.check.concat(res.check||[]).forEach(function(o){ k[o.id]=o; }); old.check=Object.keys(k).map(function(x){ return k[x]; });
    if(histF.from<old.from) old.from=histF.from; EXTRA=old; renderHist(); showToast('✅ Loaded · ပြီးပါပြီ','ok');
  }).catch(function(e){ showToast('⚠️ '+e.message,'err'); });
}
function exportCSV(){
  var rows=[['Date found','Time','Area','Tub/cage','Animal ID','Sex','Weight g','Group','Morph'].concat(PARTS.map(function(p){ return p.en; })).concat(['Status','Outcome date','Returned to','Days','Follow-ups','Employee','Notes'])];
  histRows().slice().reverse().forEach(function(c){
    rows.push([c.date,c.time,area(c.area).name,c.loc,c.aid,c.sex,c.w,c.grp,c.morph].concat(PARTS.map(function(p){ return (c.parts||[]).indexOf(p.k)>=0?1:''; }))
      .concat([{hold:'In holding',rec:'Recovered',died:'Died'}[c.st]||'', c.outD, c.outLoc, daysIn(c)+1, (c.fu||[]).map(function(f){ return f.d+' '+f.s; }).join('; '), c.emp, c.notes]));
  });
  var csv=rows.map(function(r){ return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'})); a.download='Fungus_BD_SRR2_'+histF.from+'_'+histF.to+'.csv'; a.click();
}

function renderSetup(){
  var el=document.getElementById('page-setup'), s=settings(), hidden=s.hidden||[];
  el.innerHTML='<div class="g2 stack" style="align-items:start"><div class="card"><div class="card-h"><span class="card-t">📍 Areas checked every day · <span class="my">နေ့စဉ် စစ်ရမည့်နေရာ</span></span></div><div class="card-b">'+
    '<div class="note" style="margin-bottom:8px">These come from the Animal ID app (INFR# enclosures, white tub rows, FR# cages). Untick an area you don\'t check. · Animal ID app မှ နေရာများ</div>'+
    BASE_AREAS.map(function(a){ return '<label class="part" style="margin-bottom:4px"><input type="checkbox" class="st-area" value="'+a.id+'"'+(hidden.indexOf(a.id)<0?' checked':'')+'><span>'+esc(a.name)+' <span class="note">('+a.locs.length+' tubs/cages)</span><span class="my">'+esc(a.my)+'</span></span></label>'; }).join('')+
    '<div class="lbl" style="margin-top:10px">Extra areas (one per line, e.g. Wooden Cage Room) · <span class="my">အခြား နေရာများ</span></div><textarea class="in" id="st-extra" rows="4">'+esc((s.areas||[]).map(function(a){ return a.name; }).join('\n'))+'</textarea></div></div>'+
    '<div class="card"><div class="card-h"><span class="card-t">⚙️ Settings · <span class="my">ဆက်တင်</span></span></div><div class="card-b">'+
    '<span class="lbl">Holding area name · <span class="my">ခွဲထားရာနေရာ အမည်</span></span><input class="in" id="st-hold" value="'+esc(holdName())+'">'+
    '<span class="lbl" style="margin-top:10px">Staff names (one per line) · <span class="my">ဝန်ထမ်း နာမည်များ</span></span><textarea class="in" id="st-emps" rows="6">'+esc((s.emps||[]).join('\n'))+'</textarea>'+
    '<div style="text-align:right;margin-top:10px"><button class="btn grn" onclick="saveSettings()">💾 Save settings · <span class="my">သိမ်းရန်</span></button></div>'+
    '<div class="note" style="margin-top:12px">'+(SHEET_URL?'✅ Connected to the Google Sheet':'⚠️ Not connected — paste the /exec link into SHEET_URL')+' · app '+APP_VERSION+' · '+Object.keys(PENDING).length+' waiting to send</div></div></div></div>';
}
function saveSettings(){
  var s=clone(settings()); s.id='main';
  s.hidden=BASE_AREAS.map(function(a){ return a.id; }).filter(function(id){ var cb=document.querySelector('.st-area[value="'+id+'"]'); return cb && !cb.checked; });
  var old={}; (s.areas||[]).forEach(function(a){ old[a.name.toLowerCase()]=a; });
  s.areas=document.getElementById('st-extra').value.split('\n').map(function(x){ return x.trim(); }).filter(String).map(function(n){ return old[n.toLowerCase()] || {id:'X'+n.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12), name:n, my:'', locs:[]}; });
  s.hold=document.getElementById('st-hold').value.trim()||'Fungus Holding Area';
  s.emps=document.getElementById('st-emps').value.split('\n').map(function(x){ return x.trim(); }).filter(String);
  saveRecord('settings', s); showToast('✅ Settings saved · သိမ်းပြီး','ok'); renderSetup(); updBadges();
}
